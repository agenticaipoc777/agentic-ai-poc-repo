name: Deploy Vertex AI Reasoning Engine

on:
  push:
    branches:
      - main
    paths:
      - 'bq_ai_analytics_agent/**'
      - '.github/workflows/adk-deploy-agent.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs your custom requirements including the google-adk framework
        pip install -r bq_ai_analytics_agent/requirements.txt

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Execute Native ADK Engine Update Command
      run: |
        # FIXED: Uses the production ADK CLI syntax to package and ship your directory completely
        adk deploy agent_engine \
          --project="agentic-ai-502518" \
          --region="europe-west1" \
          --name="projects/661224241135/locations/europe-west1/reasoningEngines/5739512269641875456" \
          --staging_bucket="gs://agentic-ai-502518-eu-adk-staging-bucket" \
          --requirements_file="bq_ai_analytics_agent/requirements.txt" \
          bq_ai_analytics_agent/
