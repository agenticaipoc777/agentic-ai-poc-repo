name: Deploy Vertex AI Reasoning Engine

on:
  push:
    branches:
      - main
    paths:
      - 'agent.py'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-adk google-cloud-aiplatform[reasoningengine] google-cloud-bigquery

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Execute Native ADK Agent Upgrade
      env:
        GOOGLE_CLOUD_PROJECT: "agentic-ai-502518"
        GOOGLE_CLOUD_LOCATION: "europe-west1"
        GOOGLE_GENAI_USE_VERTEXAI: "True"
      run: |
        # Use python execution to force trigger the ADK deployment package lifecycle
        python -c "
        import vertexai
        from vertexai.preview import reasoning_engines
        from agent import BigQueryAnalyticsAgent
        
        vertexai.init(project='agentic-ai-502518', location='europe-west1')
        
        print('Instantiating updated agent logic...')
        root_agent = BigQueryAnalyticsAgent()
        
        resource_path = 'projects/661224241135/locations/europe-west1/reasoningEngines/5739512269641875456'
        print(f'Connecting to targeted engine: {resource_path}')
        
        existing_engine = reasoning_engines.ReasoningEngine(resource_path)
        existing_engine.update(
            reasoning_class=root_agent,
            requirements=[
                'google-cloud-aiplatform[reasoningengine]',
                'google-cloud-bigquery',
                'python-dotenv'
            ]
        )
        print('Agent codebase has successfully finished uploading to cloud storage!')
        "
