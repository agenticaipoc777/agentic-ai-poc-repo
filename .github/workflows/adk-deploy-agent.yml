name: Deploy Vertex AI Reasoning Engine

on:
  push:
    branches:
      - main
    paths:
      # Pack and trigger whenever ANY file changes inside your agent directory
      - 'bq_ai_analytics_agent/**'
      - '.github/workflows/adk-deploy-agent.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-cloud-aiplatform[reasoningengine] google-cloud-bigquery python-dotenv

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Execute Native ADK Agent Upgrade
      env:
        GOOGLE_CLOUD_PROJECT: "agentic-ai-502518"
        GOOGLE_CLOUD_LOCATION: "europe-west1"
        GOOGLE_GENAI_USE_VERTEXAI: "True"
      run: |
        # Change execution context into your folder so the python engine packs the complete directory space
        cd bq_ai_analytics_agent
        
        # Execute your deployment script within its native folder workspace
        python deploy_agent.py
