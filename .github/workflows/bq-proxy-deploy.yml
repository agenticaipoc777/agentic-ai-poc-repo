name: Deploy BQ PG Proxy Workload to GKE

on:
  push:
    branches:
      - main
    paths:
      - 'bq_pg_proxy_app/**'
      - 'infrastructure/terraform/bq_pg_proxy.tf'
      - '.github/workflows/bq-proxy-deploy.yml'

env:
  PROJECT_ID: agentic-ai-502518
  REGION: europe-west1
  CLUSTER_NAME: adk-analytics-gke-cluster
  REPO_NAME: bq-pg-proxy-repo
  IMAGE_NAME: bq-pg-proxy-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker Authentication
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: infrastructure/terraform
      run: terraform init

    - name: Terraform Format Check
      working-directory: infrastructure/terraform
      run: terraform fmt -check -recursive
      continue-on-error: true

    - name: Terraform Validate
      working-directory: infrastructure/terraform
      run: terraform validate

    - name: Terraform Plan (bq-pg-proxy scoped resources)
      working-directory: infrastructure/terraform
      run: |
        terraform plan \
          -target=google_artifact_registry_repository.pg_proxy_repo \
          -target=google_service_account.bq_pg_proxy_sa \
          -target=google_project_iam_member.bq_pg_proxy_bq_access \
          -target=google_project_iam_member.bq_pg_proxy_job_user \
          -target=google_service_account_iam_member.bq_pg_proxy_workload_identity \
          -out=bq-pg-proxy.tfplan

    - name: Terraform Apply (bq-pg-proxy scoped resources)
      working-directory: infrastructure/terraform
      run: terraform apply -auto-approve bq-pg-proxy.tfplan

    - name: Build and Push Docker Image
      run: |
        IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}"
        docker build -t "$IMAGE:${{ env.IMAGE_TAG }}" -t "$IMAGE:latest" ./bq_pg_proxy_app
        docker push "$IMAGE:${{ env.IMAGE_TAG }}"
        docker push "$IMAGE:latest"

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.REGION }}
        project_id: ${{ env.PROJECT_ID }}

    # ROOT CAUSE FIX: the new pod was permanently stuck in
    # CreateContainerConfigError ("secret pg-proxy-creds not found")
    # because the Secret referenced by deployment.yaml's
    # PG_PROXY_ALLOWED_USERS env var was never actually created in the
    # cluster -- it can't be committed as plaintext YAML in the repo,
    # so it has to be created here, in the pipeline, from a GitHub
    # Secret. --dry-run=client -o yaml | kubectl apply -f - makes this
    # idempotent: creates it on first run, updates it if the password
    # in GitHub Secrets ever changes, errors on neither.
    #
    # One-time setup required (not in this file, done via GitHub UI):
    # Settings -> Secrets and variables -> Actions -> New repository
    # secret, name PG_PROXY_ALLOWED_USERS, value "user:password".
    - name: Create/Update pg-proxy-creds Secret
      run: |
        kubectl create secret generic pg-proxy-creds \
          --from-literal=allowed_users="${{ secrets.PG_PROXY_ALLOWED_USERS }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to GKE
      run: |
        IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
        kubectl apply -f bq_pg_proxy_app/k8s/deployment.yaml
        kubectl set image deployment/bq-pg-proxy bq-pg-proxy="$IMAGE"

    - name: Verify Rollout
      run: |
        # Timeout removed per request: waits indefinitely instead of
        # failing at a fixed limit. Now that the actual blocker (the
        # missing Secret) is fixed above, this should complete
        # quickly -- but if a future unrelated issue causes a genuine
        # hang, this step will need manual cancellation from the
        # Actions UI rather than failing on its own.
        kubectl rollout status deployment/bq-pg-proxy