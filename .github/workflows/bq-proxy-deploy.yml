name: Deploy BQ PG Proxy Workload to GKE

on:
  push:
    branches:
      - main
    paths:
      - 'bq_pg_proxy_app/**'
      - 'infrastructure/terraform/streamlit_kubernetes_iam.tf'
      - 'infrastructure/terraform/pg_proxy_variable.tf'
      - '.github/workflows/bq-proxy-deploy.yml'

env:
  PROJECT_ID: agentic-ai-502518
  REGION: europe-west1
  REPO_NAME: bq-pg-proxy-repo
  IMAGE_NAME: bq-pg-proxy-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker Authentication
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # Build/push happens BEFORE Terraform apply now. The Deployment's
    # container image is templated as
    # "...bq-pg-proxy-app:${var.pg_proxy_image_tag}" -- if Terraform
    # applied first, it would reference a tag that doesn't exist in
    # Artifact Registry yet, and the pod would fail to pull the image.
    - name: Build and Push Docker Image
      run: |
        IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}"
        docker build -t "$IMAGE:${{ env.IMAGE_TAG }}" -t "$IMAGE:latest" ./bq_pg_proxy_app
        docker push "$IMAGE:${{ env.IMAGE_TAG }}"
        docker push "$IMAGE:latest"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: infrastructure/terraform
      run: terraform init

    - name: Terraform Format Check
      working-directory: infrastructure/terraform
      run: terraform fmt -check -recursive
      continue-on-error: true

    - name: Terraform Validate
      working-directory: infrastructure/terraform
      run: terraform validate

    # CONSOLIDATED: previously two separate plan/apply pairs existed
    # -- one for a "bq_pg_proxy.tf" GCP service account that was
    # never actually correct (it referenced a phantom
    # "bq-pg-proxy-sa@..." GCP identity that was never created,
    # causing every BigQuery call to fail auth), and a second,
    # kubectl-based deploy that fought with Terraform's own
    # kubernetes provider for control of the same Deployment object
    # -- which is what caused the container to keep reverting to a
    # stale "proxy-engine" definition. That file has been deleted.
    # Terraform (via the kubernetes provider already configured in
    # streamlit_kubernetes_iam.tf) is now the ONLY thing that manages
    # the bq-pg-proxy Deployment/Service/ServiceAccount -- kubectl is
    # no longer used anywhere in this pipeline.
    - name: Terraform Plan
      working-directory: infrastructure/terraform
      run: |
        terraform plan \
          -target=google_artifact_registry_repository.pg_proxy_repo \
          -target=kubernetes_service_account_v1.proxy_sa \
          -target=google_service_account_iam_member.gke_workload_identity_binding \
          -target=kubernetes_deployment_v1.bq_pg_proxy \
          -target=kubernetes_service_v1.bq_pg_proxy_service \
          -var="pg_proxy_image_tag=${{ env.IMAGE_TAG }}" \
          -out=bq-pg-proxy.tfplan

    - name: Terraform Apply
      working-directory: infrastructure/terraform
      run: terraform apply -auto-approve bq-pg-proxy.tfplan