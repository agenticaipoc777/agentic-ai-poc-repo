apiVersion: apps/v1
kind: Deployment
metadata:
  name: bq-pg-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: bq-pg-proxy}
  template:
    metadata:
      labels: {app: bq-pg-proxy}
    spec:
      serviceAccountName: bq-pg-proxy-ksa
      containers:
        - name: bq-pg-proxy
          image: europe-west1-docker.pkg.dev/agentic-ai-502518/bq-pg-proxy-repo/bq-pg-proxy-app:latest
          ports: [{containerPort: 5432}]
          env:
            - {name: PG_PROXY_PROJECT_ID, value: "agentic-ai-502518"}
            # FIX: analytics_v3 (and the other datasets under this
            # project) live in the "EU" multi-region, confirmed via
            # the dataset's Details panel in the BigQuery console.
            # This was previously set to "europe-west1" -- a
            # different, regional (not multi-region) location.
            # BigQuery requires the query job's location to exactly
            # match the dataset's location; a mismatch fails every
            # query with "Dataset ... was not found in location ...".
            # If datasets are ever added outside "EU", a single fixed
            # location here won't cover all of them -- see the
            # per-dataset-location note from earlier in this thread.
            - {name: PG_PROXY_LOCATION, value: "EU"}
            - {name: PG_PROXY_MAX_BYTES_BILLED, value: "3298999002316"}
            - {name: PG_PROXY_MAX_RESULT_ROWS, value: "2000000"}
            - name: PG_PROXY_ALLOWED_USERS
              valueFrom:
                secretKeyRef: {name: pg-proxy-creds, key: allowed_users}
          readinessProbe: {tcpSocket: {port: 5432}, initialDelaySeconds: 5}
          livenessProbe: {tcpSocket: {port: 5432}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata:
  name: bq-pg-proxy
  namespace: default
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector: {app: bq-pg-proxy}
  ports: [{port: 5432, targetPort: 5432}]