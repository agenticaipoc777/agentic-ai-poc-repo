name: Automated GKE Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'streamlit_app/**'
      - '.github/workflows/gke-deploy.yml'

jobs:
  deploy-to-gke:
    name: Build, Containerize & Deploy to Kubernetes
    runs-on: ubuntu-latest

    # Crucial security scope for safe cloud authentication tokens
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    # 1. Pull down the repository files to the runner instance
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Extract configuration variables dynamically from variables.tf
    - name: Parse Terraform Variables
      id: tf_vars
      run: |
        # Robust parsing pattern targeting exact variable blocks and clean strings
        PROJECT_ID=$(awk '/variable "project_id"/ {flag=1; next} /}/ {flag=0} flag && /default/ {print $3}' variables.tf | tr -d '"')
        COMPUTE_REGION=$(awk '/variable "vertex_compute_region"/ {flag=1; next} /}/ {flag=0} flag && /default/ {print $3}' variables.tf | tr -d '"')
        
        echo "Extracted Project ID: $PROJECT_ID"
        echo "Extracted Compute Region: $COMPUTE_REGION"
        
        # Verify extraction succeeded before moving forward
        if [ -z "$PROJECT_ID" ] || [ -z "$COMPUTE_REGION" ]; then
          echo "❌ ERROR: Failed to extract values from variables.tf. Check naming structure."
          exit 1
        fi
        
        # Save variables to GITHUB_ENV for the remaining steps to access
        echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
        echo "COMPUTE_REGION=$COMPUTE_REGION" >> $GITHUB_ENV

    # 3. Log in securely to Google Cloud platform services
    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 4. Initialize the Google Cloud SDK toolset
    - name: Configure Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # 5. Bind Docker authorization to your dynamic Compute Region from variables.tf
    - name: Configure Docker Authentication
      run: |
        gcloud auth configure-docker ${{ env.COMPUTE_REGION }}-docker.pkg.dev --quiet

    # 6. Build, tag, and upload your Streamlit app utilizing variables.tf details
    - name: Build and Push Docker Container
      run: |
        docker build -t ${{ env.COMPUTE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/streamlit-apps/streamlit-frontend:${{ github.sha }} -t ${{ env.COMPUTE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/streamlit-apps/streamlit-frontend:latest ./streamlit_app
        docker push ${{ env.COMPUTE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/streamlit-apps/streamlit-frontend:${{ github.sha }}
        docker push ${{ env.COMPUTE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/streamlit-apps/streamlit-frontend:latest

    # 7. Establish connection credentials for your active GKE Autopilot cluster dynamically
    - name: Connect to GKE Cluster
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: adk-analytics-gke-cluster
        location: ${{ env.COMPUTE_REGION }}
        project_id: ${{ env.PROJECT_ID }}

    # 8. Substitute the commit SHA into your manifest and apply it to Kubernetes
    - name: Deploy Manifests to Kubernetes
      run: |
        # Inject the unique build tag into the deployment.yaml manifest dynamically
        sed -i "s|streamlit-frontend:latest|streamlit-frontend:${{ github.sha }}|g" ./streamlit_app/deployment.yaml
        
        # Apply the structured services configuration to GKE
        kubectl apply -f ./streamlit_app/deployment.yaml

    # 9. Fetch the public IP and display the live Streamlit URL in the GitHub Actions Log
    - name: Fetch Public Streamlit URL
      run: |
        echo "⏳ Waiting for Google Cloud to provision your public LoadBalancer IP..."
        
        # Loop until the External IP is fully active and assigned by GCP
        EXTERNAL_IP=""
        while [ -z "$EXTERNAL_IP" ]; do
          sleep 10
          EXTERNAL_IP=$(kubectl get svc streamlit-public-service -o jsonpath='{.status.loadBalancer.ingress.ip}' 2>/dev/null || echo "")
        done
        
        echo "===================================================="
        echo "🚀 STREAMLIT APP IS LIVE AT THE URL BELOW:"
        echo "streamlit-agenticai: http://$EXTERNAL_IP"
        echo "===================================================="
        
        # Output this directly to the GitHub Step Summary page for easy clicking
        echo "### 🚀 Streamlit App Deployment Complete!" >> $GITHUB_STEP_SUMMARY
        echo "Click the clean text link below to access your live portal:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # This masks the raw IP address behind the custom text label "streamlit-agenticai"
        echo "[streamlit-agenticai](http://$EXTERNAL_IP)" >> $GITHUB_STEP_SUMMARY
