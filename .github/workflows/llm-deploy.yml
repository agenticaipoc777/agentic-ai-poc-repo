name: Deploy Local LLM Chat to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'llm/**'
      - 'infrastructure/terraform/llm_cloud_run.tf'
      - 'infrastructure/terraform/llm_variable.tf'
      - '.github/workflows/llm-deploy.yml'

env:
  PROJECT_ID: agentic-ai-502518
  REGION: europe-west1
  REPO_NAME: llm-apps
  IMAGE_NAME: local-llm-chat
  IMAGE_TAG: ${{ github.sha }}
  MODEL_ID: Qwen/Qwen2.5-7B-Instruct

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker Authentication
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build and Push Docker Image
      run: |
        IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}"
        docker build --build-arg MODEL_ID=${{ env.MODEL_ID }} \
          -t "$IMAGE:${{ env.IMAGE_TAG }}" -t "$IMAGE:latest" ./llm
        docker push "$IMAGE:${{ env.IMAGE_TAG }}"
        docker push "$IMAGE:latest"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: infrastructure/terraform
      run: terraform init

    - name: Terraform Validate
      working-directory: infrastructure/terraform
      run: terraform validate

    - name: Terraform Plan
      working-directory: infrastructure/terraform
      run: |
        terraform plan \
          -target=google_artifact_registry_repository.llm_repo \
          -target=google_cloud_run_v2_service.llm_chat \
          -var="llm_image_tag=${{ env.IMAGE_TAG }}" \
          -var="llm_model_id=${{ env.MODEL_ID }}" \
          -out=llm.tfplan

    - name: Terraform Apply
      working-directory: infrastructure/terraform
      run: terraform apply -auto-approve llm.tfplan