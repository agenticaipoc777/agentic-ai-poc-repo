name: Automated MCP Server Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '**' # Triggers on any application context update across directories
      - '.github/workflows/mcp_server.yml'

jobs:
  deploy-mcp:
    name: Build, Containerize & Release MCP Server
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    # 1. Pull down repository files
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Automatically discover variables.tf and extract runtime profiles dynamically
    - name: Parse Terraform Variables
      id: tf_vars
      run: |
        echo "🔍 Discovering variable configuration manifest..."
        VAR_FILE_PATH=$(find . -name "variables.tf" -print -quit)
        
        if [ -z "$VAR_FILE_PATH" ]; then
          echo "❌ ERROR: variables.tf file not found!"
          exit 1
        fi
        
        PROJECT_ID=$(awk '/variable "project_id"/ {flag=1; next} /}/ {flag=0} flag && /default/ {print $3}' "$VAR_FILE_PATH" | tr -d '"')
        COMPUTE_REGION=$(awk '/variable "vertex_compute_region"/ {flag=1; next} /}/ {flag=0} flag && /default/ {print $3}' "$VAR_FILE_PATH" | tr -d '"')
        
        echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
        echo "COMPUTE_REGION=$COMPUTE_REGION" >> $GITHUB_ENV

    # 3. Log in securely using pipeline encryption contexts
    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 4. Initialize Cloud SDK CLI tools
    - name: Configure Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # 5. Connect Docker to your variable-driven Artifact Registry endpoint
    - name: Configure Docker Authentication
      run: |
        gcloud auth configure-docker ${{ env.COMPUTE_REGION }}-docker.pkg.dev --quiet

    # 6. Containerize your code by dynamically identifying the application root path
    - name: Build and Push Docker Container
      run: |
        echo "🔍 Locating application directory housing your Dockerfile..."
        # Finds the directory containing the Dockerfile, ignoring the root directory if it's top-level
        APP_PATH=$(find . -name "Dockerfile" -not -path "./Dockerfile" -printf '%h\n' -quit)
        
        # Fallback to root context if no subfolder Dockerfile matches
        if [ -z "$APP_PATH" ]; then
          echo "⚠️ Specific subfolder Dockerfile not found. Falling back to repository root directory context."
          APP_PATH="."
        fi
        
        echo "Building Docker image utilizing path target context: $APP_PATH"
        
        docker build -t ${{ env.COMPUTE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/mcp-server-repo/bq-mcp-analytics-engine:${{ github.sha }} -t ${{ env.COMPUTE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/mcp-server-repo/bq-mcp-analytics-engine:latest "$APP_PATH"
        docker push ${{ env.COMPUTE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/mcp-server-repo/bq-mcp-analytics-engine:${{ github.sha }}
        docker push ${{ env.COMPUTE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/mcp-server-repo/bq-mcp-analytics-engine:latest

    # 7. Update the Cloud Run server instance image with zero structural downtime
    - name: Deploy to Cloud Run
      run: |
        gcloud run services update bq-mcp-analytics-engine \
          --image=${{ env.COMPUTE_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/mcp-server-repo/bq-mcp-analytics-engine:${{ github.sha }} \
          --region=${{ env.COMPUTE_REGION }} \
          --project=${{ env.PROJECT_ID }}
