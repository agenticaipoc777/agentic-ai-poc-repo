apiVersion: apps/v1
kind: Deployment
metadata:
  name: bq-pg-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: bq-pg-proxy}
  template:
    metadata:
      labels: {app: bq-pg-proxy}
    spec:
      serviceAccountName: bq-pg-proxy-ksa
      containers:
        # FIX: name must be exactly "bq-pg-proxy" -- this is what the
        # pipeline's `kubectl set image deployment/bq-pg-proxy
        # bq-pg-proxy=...` step targets by name. A prior version of
        # this file (or a manual kubectl edit) apparently used a
        # different container name ("proxy-engine"), which is why the
        # last rollout ended up with TWO containers in one pod instead
        # of cleanly replacing one -- Kubernetes treated them as
        # different container specs rather than the same container
        # being updated.
        - name: bq-pg-proxy
          image: europe-west1-docker.pkg.dev/agentic-ai-502518/bq-pg-proxy-repo/bq-pg-proxy-app:latest
          ports: [{containerPort: 5432}]
          # REQUIRED on GKE Autopilot -- pods without explicit
          # resource requests can fail to schedule cleanly. Also
          # matches what the previously-Running container was
          # actually granted (500m cpu / 2Gi memory), so this isn't a
          # downgrade from what was already working.
          resources:
            requests: {cpu: "500m", memory: "2Gi"}
            limits: {cpu: "1", memory: "2Gi"}
          env:
            - {name: PG_PROXY_LISTEN_HOST, value: "0.0.0.0"}
            - {name: PG_PROXY_PROJECT_ID, value: "agentic-ai-502518"}
            - {name: PG_PROXY_LOCATION, value: "EU"}
            - {name: PG_PROXY_MAX_BYTES_BILLED, value: "3298999002316"}
            - {name: PG_PROXY_MAX_RESULT_ROWS, value: "2000000"}
            # TEMPORARY, FOR TESTING ONLY: hardcoded per explicit
            # request to unblock local testing quickly. This value is
            # now in plaintext in this file and in Git history. Before
            # this goes beyond your own testing, swap back to the
            # secretKeyRef version below (commented out) with a real
            # credential set in GitHub Secrets -> PG_PROXY_ALLOWED_USERS,
            # and treat this commit as one to revert/rewrite, not just
            # build on top of.
            - {name: PG_PROXY_ALLOWED_USERS, value: "root:pass123"}
            # - name: PG_PROXY_ALLOWED_USERS
            #   valueFrom:
            #     secretKeyRef: {name: pg-proxy-creds, key: allowed_users}
          readinessProbe: {tcpSocket: {port: 5432}, initialDelaySeconds: 5}
          livenessProbe: {tcpSocket: {port: 5432}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata:
  name: bq-pg-proxy
  namespace: default
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector: {app: bq-pg-proxy}
  ports: [{port: 5432, targetPort: 5432}]